status:
  scope: 'Fully formalized: the compared theorem `MeanValueProblem.mean_value_problem.disproof` in `Challenge.lean`
    is proved in `Solution.lean` via the imported module `MeanValueProblem.Resolutions.MeanValueProblem` with no
    `sorry` and no axioms beyond propext, Quot.sound and Classical.choice. Only the negation of the formal conjecture
    is advertised; stronger or more specific facts visible in the proof are not part of the compared statement.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
  - method: autonomous
    models:
    - GPT-6 Astra (pre-release version, OpenAI)
    framework: Inspect AI (UK AISI) with the LeanOpenProblems task harness; deepagent-based agent
    tool_setup: 'The model worked alone in a Docker container without network access, with bash, a text editor,
      a resource-budget tool, a Lean 4 toolchain (v4.27.0) with Mathlib (via Formal Conjectures at commit 9cbe1d3c1299),
      SageMath, Python (sympy, mpmath, numpy, pantograph), subagents, persistent memory and a todo list; no literature
      snapshot. Its submission was checked in a separate pristine container by Comparator (Lean FRO) against the
      trusted statement, permitting only the three standard axioms. Budget: $1,000 and 96 hours of working time
      per statement, one attempt.'
    cost:
      wall_time: 15.0 hours of agent working time (harness working_time, excluding API retry waits)
      spend_usd: 265 USD, computed from the attempt's token counts at GPT-6 Astra's standard rates (USD 10 per million
        input tokens, 50 per million output tokens, 1 per million cache-read tokens and 12.50 per million cache-write
        tokens)
      hardware: API-only inference; the agent's sandbox ran on Epoch AI's cloud evaluation infrastructure
    prompting_notes: 'Fixed task prompt from the harness (apn/prompts.py in LeanOpenProblems): settle the conjecture
      in Spec.lean by filling the `sorry` of either the statement or its `.disproof` negation without altering either
      statement or the imports, using only the permitted axioms; a description of the available tools; and general
      encouragement that open conjectures are not infeasible. No problem-specific hints or human interaction.'
  notes: 'The Lean development was written entirely by the AI system inside the harness, in the evaluation run `wikipedia-vega-1000usd`
    of Epoch AI''s LeanOpenProblems harness (2026-09), in which a pre-release version of GPT-6 Astra attempted,
    autonomously and once each, all 222 research-open statements of the `Wikipedia` collection of Formal Conjectures
    under a budget of $1,000 and 96 hours of working time per statement. Tom Adamczewski ran the harness and packaged
    the verified output into this repository. The only edits to the AI-written file are mechanical and are listed
    in the README: removed the sorry''d stub of the original conjecture `mean_value_problem` (lines 27–33 of the
    original) together with its docstring; restated `MeanValueProblem.mean_value_problem.disproof` explicitly (the
    original used `¬ (type_of% @MeanValueProblem.mean_value_problem)`, which referenced the removed stub) and added
    a docstring.'
fidelity:
  divergences: 'The compared theorem is exactly the negation of the Formal Conjectures statement, restated explicitly:
    for every `p : Polynomial ℂ` with `2 ≤ p.degree`, every `z : ℂ` and every `K : ℝ`, there is `c` with `p.derivative.eval
    c = 0` and `‖p.eval z - p.eval c‖ / ‖z - c‖ ≤ ‖p.derivative.eval z‖`. The parameter `K` is unused in the Formal
    Conjectures statement (the constant is fixed at 1). Lean''s convention `x / 0 = 0` makes the case `p''(z) =
    0` hold trivially with `c = z`, so the formal conjecture is if anything weaker than the informal one; the counterexample
    uses `z = 0` with `p''(0) = 1`, so it refutes the informal conjecture as stated in the literature.'
review:
  status: 'mechanically verified (Comparator: Lean kernel replay, standard axioms only) in the harness and again
    in this repository''s CI; no human mathematical review yet'
  reviewers:
  - none
  notes: 'Statement audit: the statement is Formal Conjectures'' formalization of the problem, taken as is; its
    correspondence to the informal problem is discussed in fidelity.divergences and the README. Mathematical review:
    none beyond mechanical verification; the informal proof account in the README was machine-generated from the
    Lean proof and has not been checked by a human expert.'
alignment:
  namespace: MeanValueProblem
  statements:
