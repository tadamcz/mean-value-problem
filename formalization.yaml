version: v0.4
project:
  name: 'Smale''s mean value conjecture (K = 1): disproof'
  description: 'Disproof of Smale''s mean value conjecture with constant K = 1: there is a complex polynomial p
    of degree at least 2 and a point z such that every critical point c of p has |p(z) − p(c)|/|z − c| > |p''(z)|.
    Found autonomously by GPT-6 Astra in an Epoch AI evaluation run over the open problems of Formal Conjectures''
    Wikipedia collection.'
  authors:
  - name: Tom Adamczewski
    github: tadamcz
    orcid: https://orcid.org/0000-0001-6772-1185
  license: Apache-2.0
  responsible_maintainers:
  - name: Tom Adamczewski
    github: tadamcz
    orcid: https://orcid.org/0000-0001-6772-1185
classification:
  arxiv:
  - math.CV
  msc2020:
  - 30C10
  - 30C15
sources:
- title: 'Smale''s mean value conjecture (K = 1): disproof'
  type: original-proof
  relationship: other
  note: This formalization is the first presentation of the result. The Lean proof was found by a pre-release version
    of GPT-6 Astra working autonomously in Epoch AI's LeanOpenProblems harness; no human wrote or steered the proof.
    The proof has been machine-checked but not yet examined in depth by human experts; novelty of its ideas relative
    to the literature has not been established.
- title: Smale's mean value conjecture (K = 1) (Wikipedia)
  type: web discussion
  id: https://en.wikipedia.org/wiki/Mean_value_problem
  location: https://en.wikipedia.org/wiki/Mean_value_problem
